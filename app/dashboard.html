    <script>
      (function () {
        const savedUser = sessionStorage.getItem('loggedInUser') || localStorage.getItem('loggedInUser');
        const savedRole = sessionStorage.getItem('userRole') || localStorage.getItem('userRole');
        const loginUrl = (typeof SITE !== 'undefined' && SITE.pages && SITE.pages.login) ? SITE.pages.login : 'app/login.html';
        const adminUrl = (typeof SITE !== 'undefined' && SITE.pages && SITE.pages.admin) ? SITE.pages.admin : 'app/admin-panel.html';
        if (!savedUser) {
          window.location.href = loginUrl;
          return;
        }
        if (savedRole === 'admin') {
          // prevent admins from accessing student dashboard
          window.location.href = adminUrl;
          return;
        }
      })();

    <style>
      .dashboard-notifications {
        margin: 1rem 0 1.5rem;

        color: var(--text-color-primary);
      }

      .dashboard-notification-card {
        padding: 0.8rem 0.95rem;

        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(100, 41, 239, 0.12);
        margin-bottom: 0.7rem;
      }

      body.dark-mode .dashboard-notification-card {
        background: rgba(30, 30, 42, 0.95);
      }

      .dashboard-notification-card:last-child {
        margin-bottom: 0;
      }

      .dashboard-notification-card p {
        margin: 0;
        color: var(--text-color-primary);
        line-height: 1.5;
      }

      .dashboard-notification-card a,
      .notification-link {
        color: var(--first-color);
        font-weight: 700;
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 2px;
      }

      .dashboard-notification-card a:hover,
      .notification-link:hover {
        color: var(--first-color-hover);
      }

      .dashboard-notification-meta {
        display: inline-block;
        margin-top: 0.4rem;
        font-size: 0.78rem;
        color: var(--first-color);
        font-weight: 600;
      }
    </style>

    <script>
        const NOTIFICATION_STORAGE_KEY = 'studentNotifications';

        function getSitePage(pageKey) {
            const fallbackPages = {
                home: '../index.html',
                login: '../app/login.html',
                dashboard: '../app/dashboard.html',
                admin: '../app/admin-panel.html',
                classDetail: '../app/class-detail.html'
            };
            if (window.SITE && window.SITE.pages && window.SITE.pages[pageKey]) {
                return window.SITE.pages[pageKey];
            }
            return fallbackPages[pageKey] || '../index.html';
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatNotificationMessage(text) {
            const escaped = escapeHtml(text || '');
            return escaped.replace(/(https?:\/\/[^\s]+|www\.[^\s]+)/g, (url) => {
                const href = /^www\./i.test(url) ? `https://${url}` : url;
                return `<a class="notification-link" href="${href}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            });
        }

        function getNotificationData() {
            try {
                const stored = localStorage.getItem(NOTIFICATION_STORAGE_KEY);
                return stored ? JSON.parse(stored) : [];
            } catch (err) {
                console.error('Error loading notifications:', err);
                return [];
            }
        }

        function loadDashboardNotifications() {
            const list = document.getElementById('dashboardNotificationsList');
            if (!list) return;

            const notifications = getNotificationData().slice().sort((a, b) => (b.id || '').localeCompare(a.id || ''));
            if (!notifications.length) {
                list.innerHTML = '<div class="empty-state"><i class="uil uil-bell-slash"></i><p>No alerts yet.</p></div>';
                return;
            }

            list.innerHTML = notifications.slice(0, 4).map((item) => `
                <div class="dashboard-notification-card">
                    <p>${formatNotificationMessage(item.message)}</p>
                    <span class="dashboard-notification-meta">For ${item.classes.map((cls) => `Class ${cls}`).join(', ')}</span>
                </div>
            `).join('');
        }

        // Load and display chapter data in class cards
        async function loadChapterDataFallback() {
            const stored = localStorage.getItem('chaptersData');
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch (err) {
                    console.warn('Failed to parse cached chapters data:', err);
                }
            }

            const chaptersUrl = typeof SITE !== 'undefined' ? SITE.data.chapters : '../assets/data/chapters.json';
            const res = await fetch(chaptersUrl);
            const data = await res.json();
            localStorage.setItem('chaptersData', JSON.stringify(data));
            return data;
        }

        async function initDashboardChapters() {
            try {
                const driveService = window.DriveService || window.driveService || (typeof DriveService !== 'undefined' ? DriveService : null);
                const chaptersData = driveService && typeof driveService.fetchChapters === 'function'
                    ? await driveService.fetchChapters()
                    : await loadChapterDataFallback();
                
                // Update each class card with chapter count
                const classIds = ['6', '7', '8', '9', '10'];
                classIds.forEach(classId => {
                    const card = document.querySelector(`.class-card[data-class="${classId}"]`);
                    if (card) {
                        const classData = chaptersData[classId];
                        const chapterCount = classData && classData.chapters ? classData.chapters.length : 0;
                        
                        const content = card.querySelector('.class-content');
                        if (content) {
                            const countHtml = chapterCount > 0 
                                ? `<p class="chapter-count" style="font-size: 0.85rem; color: var(--first-color); margin-top: 4px;"><i class="uil uil-book-open"></i> ${chapterCount} chapter${chapterCount !== 1 ? 's' : ''}</p>`
                                : `<p class="chapter-count" style="font-size: 0.85rem; color: var(--text-color-second); margin-top: 4px;">No chapters yet</p>`;
                            
                            const existingCount = content.querySelector('.chapter-count');
                            if (existingCount) {
                                existingCount.remove();
                            }
                            content.insertAdjacentHTML('beforeend', countHtml);
                        }
                    }
                });
            } catch (err) {
                console.error('Error loading chapters for dashboard:', err);
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initDashboardChapters();
            loadDashboardNotifications();
        });
        
        // Listen for storage changes (when admin updates chapters)
        window.addEventListener('storage', (event) => {
            if (event.key === 'chaptersData' && event.newValue) {
                initDashboardChapters();
            }
            if (event.key === NOTIFICATION_STORAGE_KEY) {
                loadDashboardNotifications();
            }
        });

        window.addEventListener('chaptersDataRefreshed', () => {
            initDashboardChapters();
        });

        window.addEventListener('notificationsUpdated', loadDashboardNotifications);
    </script>
