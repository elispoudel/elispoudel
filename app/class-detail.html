<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Details</title>
    
    <!-- --------- PWA META TAGS ---------- -->
    <meta name="theme-color" content="#6429ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Class Details" />
    
    <!-- --------- PRELOAD / CONNECTION HINTS ---------- -->
    <link rel="dns-prefetch" href="//unicons.iconscout.com" />
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://unicons.iconscout.com" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <!-- --------- UNICONS ---------- -->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css" />
    
    <!-- --------- CSS ---------- -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .class-detail-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
            padding-top: calc(90px + 0.5cm);
        }

        .class-header {
            margin-bottom: 2rem;
        }

        .class-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .class-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-color-primary);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1rem;
            padding: 8px 16px;
            background: var(--first-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--first-color-hover);
            transform: translateX(-4px);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            align-items: start;
        }

        .empty-state {
            text-align: center;
            color: var(--text-color-second);
            padding: 2rem;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        body.dark-mode .chapters-section {
            background: rgba(50, 50, 60, 0.7);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .chapters-section h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--text-color-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chapters-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chapter-btn {
            padding: 12px 16px;
            background: var(--first-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .chapter-btn:hover {
            background: var(--first-color-hover);
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(100, 41, 239, 0.3);
        }

        .chapter-btn.active {
            background: var(--first-color-hover);
            box-shadow: 0 4px 12px rgba(100, 41, 239, 0.3);
        }

        .empty-state {
            text-align: center;
            color: var(--text-color-second);
            padding: 2rem;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .notifications-section {
            margin-bottom: 1.5rem;
            padding: 0;
            border-radius: 18px;
            background: transparent;
            border: none;
            box-shadow: none;
            overflow: hidden;
            display: none;
        }

        .notifications-section.active {
            display: block;
            padding: 1.15rem;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.98) 0%, rgba(240, 231, 255, 0.95) 45%, rgba(132, 95, 255, 0.18) 100%);
            border: 1px solid rgba(100, 41, 239, 0.22);
            box-shadow: 0 12px 28px rgba(100, 41, 239, 0.12);
            backdrop-filter: blur(8px);
            position: relative;
            overflow: hidden;
        }

        .notifications-section.active::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 6px;
            background: linear-gradient(180deg, rgba(100, 41, 239, 0.95) 0%, rgba(153, 106, 255, 0.55) 100%);
            border-radius: 0 999px 999px 0;
        }

        body.dark-mode .notifications-section.active {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0%, rgba(130, 95, 255, 0.2) 45%, rgba(86, 47, 199, 0.3) 100%);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
        }

        .notifications-toggle {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 999px;
            background: var(--first-color);
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(100, 41, 239, 0.18);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .notifications-toggle:hover {
            transform: translateY(-2px);
            background: var(--first-color-hover);
        }

        .notifications-toggle.active {
            background: var(--first-color-hover);
        }

        body.dark-mode .notifications-section {
            background: rgba(50, 50, 60, 0.7);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        .notifications-section h2 {
            font-size: 1.15rem;
            margin: 0 0 0.85rem;
            color: var(--text-color-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .notice-card {
            padding: 1rem 1.1rem;
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(241, 234, 255, 0.95));
            border: 1px solid rgba(100, 41, 239, 0.18);
            margin-bottom: 0.9rem;
            box-shadow: 0 20px 45px rgba(100, 41, 239, 0.08);
            min-height: 2.2cm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .notice-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 60px rgba(100, 41, 239, 0.12);
            background: linear-gradient(145deg, rgba(255, 255, 255, 1), rgba(234, 228, 255, 1));
        }

        .notice-card p {
            margin: 0;
            color: var(--text-color-primary);
            line-height: 1.7;
            font-size: 0.95rem;
            font-weight: 500;
            word-break: break-word;
        }

        .notice-card .notice-date {
            margin-top: 0.65rem;
            font-size: 0.78rem;
            color: var(--text-color-second);
            letter-spacing: 0.02em;
        }

        .notifications-panel {
            display: none;
            margin-top: 0.8rem;
        }

        .notifications-panel.active {
            display: block;
        }

        .notice-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
        }

        .popup-toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: min(360px, calc(100vw - 32px));
            padding: 1.05rem 1rem 1.05rem 1rem;
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(239, 234, 255, 0.97));
            color: var(--text-color-primary);
            box-shadow: 0 26px 70px rgba(100, 41, 239, 0.16);
            border: 1px solid rgba(100, 41, 239, 0.18);
            z-index: 1200;
            opacity: 0;
            transform: translateY(18px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
            backdrop-filter: blur(18px);
        }

        .popup-toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .popup-toast .popup-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(100, 41, 239, 0.16);
            color: var(--first-color);
            font-size: 1.2rem;
            margin-right: 0.85rem;
            flex-shrink: 0;
            box-shadow: inset 0 0 0 1px rgba(100, 41, 239, 0.08);
        }

        .popup-toast .popup-content {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .popup-toast .popup-body {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 0.35rem;
        }

        .popup-toast .popup-header {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            flex-wrap: wrap;
        }

        .popup-toast .popup-title {
            font-weight: 800;
            margin: 0;
            font-size: 0.95rem;
            color: var(--first-color);
        }

        .popup-toast .popup-message {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-color-primary);
            flex: 1 1 100%;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        body.dark-mode .popup-toast {
            background: linear-gradient(135deg, rgba(35, 35, 46, 0.98) 0%, rgba(50, 50, 62, 0.98) 100%);
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.28);
        }

        body.dark-mode .popup-toast .popup-icon {
            background: rgba(255, 255, 255, 0.12);
            color: #ffd978;
        }

        body.dark-mode .notice-card {
            background: rgba(30, 30, 42, 0.95);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .notice-card:last-child {
            margin-bottom: 0;
        }

        .notice-card p {
            margin: 0;
            color: var(--text-color-primary);
            line-height: 1.6;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .notice-card a,
        .notification-link {
            color: var(--first-color);
            font-weight: 700;
            text-decoration: underline;
            text-decoration-thickness: 1.5px;
            text-underline-offset: 2px;
        }

        .notice-card a:hover,
        .notification-link:hover {
            color: var(--first-color-hover);
        }

        .notice-date {
            display: inline-block;
            margin-top: 0.5rem;
            font-size: 0.78rem;
            color: var(--text-color-second);
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        body.dark-mode .notice-date {
            color: #ffb3b3;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            /* Embedded viewer CSS removed; modal viewer is used instead */
        }
    </style>
</head>
<body>
    <div class="container">
        <nav id="header" role="navigation" aria-label="Primary navigation">
            <div class="nav-logo">
                <a href="../index.html" class="nav-logo-profile">
                    <div class="nav-logo-text">
                        <p class="nav-name">Elis Poudel</p>
                    </div>
                </a>
            </div>
            <div class="nav-icons">
                <div class="dark-mode-toggle">
                    <button id="darkModeToggle" aria-label="Toggle dark mode">
                        <i class="uil uil-moon" id="darkModeIcon"></i>
                    </button>
                </div>
                <div class="profile-menu">
                    <button id="profileMenuToggle" aria-label="Toggle profile menu" class="profile-avatar">
                        <i class="uil uil-user-circle"></i>
                        <span id="profileUsername" class="profile-name">Student</span>
                    </button>
                    <div id="profileDropdown" class="profile-dropdown">
                        <div class="profile-item logout-item" id="logoutDropdown">
                            <i class="uil uil-sign-out-alt"></i>
                            <span>Logout</span>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="wrapper class-detail-container" id="main-content" role="main">
            <div class="class-header">
                <div class="class-header-row">
                    <button class="back-btn" onclick="window.history.back()">
                        <i class="uil uil-arrow-left"></i>
                        Back to Dashboard
                    </button>
                    <button class="notifications-toggle" id="notificationsToggle" type="button" aria-label="Toggle notifications" title="Notification Alerts">
                        <i class="uil uil-bell"></i>
                    </button>
                </div>
                <h1 id="classTitle">Class Details</h1>
            </div>

            <div class="main-content">
                <section class="notifications-section" id="notificationsSection" aria-label="Class notifications">
                    <h2>
                        <i class="uil uil-bell"></i>
                        Notification Alerts
                    </h2>
                    <div class="notifications-panel" id="notificationsPanel">
                        <div id="studentNotificationsList"></div>
                    </div>
                </section>

                <!-- Chapter Notes Section -->
                <div class="chapters-section">
                    <h2>
                        <i class="uil uil-book-open"></i>
                        Chapter Notes
                    </h2>
                    <div class="chapters-list" id="chaptersList">
                        <div class="empty-state">
                            <i class="uil uil-inbox"></i>
                            <p>No chapters available yet</p>
                        </div>
                    </div>
                </div>

                <!-- PDF Viewer handled by modal; removed embedded viewer for a cleaner UI -->
            </div>
        </main>
    </div>

    <!-- PDF.js Library -->
    <link rel="stylesheet" href="../assets/css/pdf-viewer.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script defer src="../assets/js/pdf-viewer.js"></script>
    <script defer src="../assets/js/paths.js"></script>
    <script defer src="../assets/js/drive-config.js"></script>
    <script defer src="../assets/js/drive-service.js"></script>
    <script>
        let chaptersDataCache = null;
        let notificationsDataCache = [];
        const NOTIFICATION_STORAGE_KEY = 'studentNotifications';

        function getSitePage(pageKey) {
            const fallbackPages = {
                home: '../index.html',
                login: '../app/login.html',
                dashboard: '../app/dashboard.html',
                admin: '../app/admin-panel.html',
                classDetail: '../app/class-detail.html'
            };
            if (window.SITE && window.SITE.pages && window.SITE.pages[pageKey]) {
                return window.SITE.pages[pageKey];
            }
            return fallbackPages[pageKey] || '../index.html';
        }

        // Restore session from localStorage if available
        if (!sessionStorage.getItem('loggedInUser')) {
            const savedUser = localStorage.getItem('loggedInUser');
            const savedRole = localStorage.getItem('userRole');
            if (savedUser) {
                sessionStorage.setItem('loggedInUser', savedUser);
                sessionStorage.setItem('userRole', savedRole || 'student');
            }
        }

        if (!sessionStorage.getItem('loggedInUser')) {
            window.location.href = getSitePage('login');
        }

        // Get class ID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const classId = urlParams.get('id');

        if (!classId) {
            window.location.href = getSitePage('dashboard');
        }

        async function loadChapterDataFallback() {
            const stored = localStorage.getItem('chaptersData');
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch (err) {
                    console.warn('Failed to parse cached chapters data:', err);
                }
            }

            const chaptersUrl = typeof SITE !== 'undefined' ? SITE.data.chapters : '../assets/data/chapters.json';
            const res = await fetch(chaptersUrl);
            const data = await res.json();
            localStorage.setItem('chaptersData', JSON.stringify(data));
            return data;
        }

        async function initPage() {
            try {
                const driveService = window.DriveService || window.driveService || (typeof DriveService !== 'undefined' ? DriveService : null);
                if (driveService && typeof driveService.fetchChapters === 'function') {
                    chaptersDataCache = await driveService.fetchChapters();
                    localStorage.setItem('chaptersData', JSON.stringify(chaptersDataCache));
                } else {
                    chaptersDataCache = await loadChapterDataFallback();
                }

                const classData = chaptersDataCache[classId];

                if (!classData) {
                    console.error('Class not found');
                    return;
                }

                document.getElementById('classTitle').textContent = classData.title;
                document.title = classData.title + ' - Chapter Notes';

                loadChapters(classData.chapters);
                loadNotifications();

                        // add admin diagnostic button if admin
                        try {
                            const role = sessionStorage.getItem('userRole') || localStorage.getItem('userRole');
                            if (role === 'admin') addPdfDiagButton();
                        } catch (e) {}

                const username = sessionStorage.getItem('loggedInUser') || 'Student';
                document.getElementById('profileUsername').textContent = username;

            } catch (err) {
                console.error('Error loading class data:', err);
                document.getElementById('chaptersList').innerHTML = 
                    '<div class="empty-state"><i class="uil uil-alert"></i><p>Error loading chapters: ' + err.message + '</p></div>';
            }
        }

        function addPdfDiagButton() {
            const chaptersSection = document.querySelector('.chapters-section');
            if (!chaptersSection) return;
            if (document.getElementById('pdfDiagBtn')) return;
            const wrapper = document.createElement('div');
            wrapper.style.margin = '12px 0';
            const btn = document.createElement('button');
            btn.id = 'pdfDiagBtn';
            btn.className = 'chapter-btn';
            btn.textContent = 'Diagnose PDF access (admin)';
            btn.title = 'Check Apps Script endpoint and Drive fallback for a fileId';
            btn.addEventListener('click', async () => {
                // find active chapter or prompt
                const active = document.querySelector('.chapter-btn.active');
                let fileId = active ? active.getAttribute('data-pdf-id') : null;
                if (!fileId) fileId = prompt('Enter Drive fileId to diagnose');
                if (!fileId) return;
                try {
                    const results = await window.PDFViewer.diagnose(fileId);
                    console.log('PDF diagnose result', results);
                    alert(JSON.stringify(results, null, 2).slice(0, 4000));
                } catch (err) {
                    console.error('Diagnose failed', err);
                    alert('Diagnose failed: ' + err.message);
                }
            });
            wrapper.appendChild(btn);
            const list = document.getElementById('chaptersList');
            chaptersSection.insertBefore(wrapper, list);
        }

        window.addEventListener('storage', (event) => {
            if (event.key === NOTIFICATION_STORAGE_KEY) {
                loadNotifications();
                return;
            }

            if (event.key !== 'chaptersData' || !event.newValue) return;
            try {
                const updatedData = JSON.parse(event.newValue);
                chaptersDataCache = updatedData;
                const classData = chaptersDataCache[classId];
                if (classData) {
                    loadChapters(classData.chapters);
                }
            } catch (err) {
                console.error('Failed to parse updated chapters data from storage event:', err);
            }
        });

        window.addEventListener('notificationsUpdated', loadNotifications);

        function getNotificationsData() {
            try {
                const stored = localStorage.getItem(NOTIFICATION_STORAGE_KEY);
                return stored ? JSON.parse(stored) : [];
            } catch (err) {
                console.error('Error loading notifications:', err);
                return [];
            }
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatNotificationMessage(text) {
            const escaped = escapeHtml(text || '');
            return escaped.replace(/(https?:\/\/[^\s]+|www\.[^\s]+)/g, (url) => {
                const href = /^www\./i.test(url) ? `https://${url}` : url;
                return `<a class="notification-link" href="${href}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            });
        }

        let popupTimer = null;
        let popupQueue = [];
        let popupIndex = 0;

        function clearPopupToast() {
            const existing = document.getElementById('popupToast');
            if (existing) existing.remove();
            clearTimeout(popupTimer);
        }

        function showPopupToast(message) {
            clearPopupToast();

            const toast = document.createElement('div');
            toast.id = 'popupToast';
            toast.className = 'popup-toast';
            toast.innerHTML = `
                <div class="popup-content">
                    <div class="popup-icon">🔔</div>
                    <div class="popup-body">
                        <div class="popup-header">
                            <div class="popup-title">New alert ✨</div>
                        </div>
                        <p class="popup-message">${escapeHtml(message)}</p>
                    </div>
                </div>
            `;
            document.body.appendChild(toast);

            requestAnimationFrame(() => toast.classList.add('show'));
            popupTimer = setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);

                if (popupQueue.length > 1) {
                    popupIndex = (popupIndex + 1) % popupQueue.length;
                    showPopupToast(popupQueue[popupIndex]);
                }
            }, 6000);
        }

        function loadNotifications() {
            notificationsDataCache = getNotificationsData();
            const list = document.getElementById('studentNotificationsList');
            const panel = document.getElementById('notificationsPanel');
            const section = document.getElementById('notificationsSection');
            const toggle = document.getElementById('notificationsToggle');
            if (!list || !panel || !section) return;

            const filtered = notificationsDataCache.filter((item) => item.classes.includes(String(classId)));
            popupQueue = filtered.map((item) => item.message).filter(Boolean);
            popupIndex = 0;

            if (!filtered.length) {
                clearPopupToast();
                list.innerHTML = '';
                section.classList.remove('active');
                panel.classList.remove('active');
                if (toggle) toggle.classList.remove('active');
                return;
            }

            list.innerHTML = filtered.map((item) => `
                <div class="notice-card">
                    <p>${formatNotificationMessage(item.message)}</p>
                    <span class="notice-date">For Class ${item.classes.join(', Class ')}</span>
                </div>
            `).join('');

            if (popupQueue.length) {
                showPopupToast(popupQueue[0]);
            }

            section.classList.remove('active');
            panel.classList.remove('active');
            if (toggle) toggle.classList.remove('active');
        }

        function loadChapters(chapters) {
            const chaptersList = document.getElementById('chaptersList');
            
            if (!chapters || chapters.length === 0) {
                chaptersList.innerHTML = '<div class="empty-state"><i class="uil uil-inbox"></i><p>No chapters available yet</p></div>';
                return;
            }

            chaptersList.innerHTML = '';
            chapters.forEach((chapter, index) => {
                const btn = document.createElement('button');
                btn.className = 'chapter-btn';
                btn.textContent = chapter.title || `Chapter ${index + 1}`;

                // Attach data attributes for the global PDF viewer
                if (chapter.driveFileId) btn.setAttribute('data-pdf-id', chapter.driveFileId);
                else if (chapter.pdfFile) {
                    const service = window.DriveService;
                    const url = service && typeof service.getPdfUrl === 'function' ? service.getPdfUrl(chapter) : null;
                    if (url) btn.setAttribute('data-pdf-url', url);
                }

                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const fileId = btn.getAttribute('data-pdf-id');
                    const url = btn.getAttribute('data-pdf-url');
                    const title = chapter.title || (chapter.pdfFile || fileId || `Chapter ${index+1}`);

                    if (window.PDFViewer && typeof PDFViewer.open === 'function') {
                        PDFViewer.open({ url: url || undefined, fileId: fileId || undefined });
                    } else {
                        // fallback: open in new tab
                        if (url) window.open(url, '_blank');
                        else if (fileId) window.open('https://drive.google.com/file/d/' + encodeURIComponent(fileId) + '/view', '_blank');
                    }
                });

                chaptersList.appendChild(btn);
            });
        }

        const notificationsToggle = document.getElementById('notificationsToggle');
        const notificationsPanel = document.getElementById('notificationsPanel');
        const notificationsSection = document.getElementById('notificationsSection');
        if (notificationsToggle && notificationsPanel && notificationsSection) {
            notificationsToggle.addEventListener('click', () => {
                const filtered = notificationsDataCache.filter((item) => item.classes.includes(String(classId)));
                const shouldOpen = !notificationsSection.classList.contains('active');

                if (!filtered.length) {
                    if (shouldOpen) {
                        notificationsPanel.innerHTML = '<div class="notice-card"><p>No alerts for this class yet.</p></div>';
                        notificationsSection.classList.add('active');
                        notificationsPanel.classList.add('active');
                        notificationsToggle.classList.add('active');
                    } else {
                        notificationsPanel.innerHTML = '';
                        notificationsSection.classList.remove('active');
                        notificationsPanel.classList.remove('active');
                        notificationsToggle.classList.remove('active');
                    }
                    return;
                }

                if (shouldOpen) {
                    notificationsSection.classList.add('active');
                    notificationsPanel.classList.add('active');
                    notificationsToggle.classList.add('active');
                } else {
                    notificationsSection.classList.remove('active');
                    notificationsPanel.classList.remove('active');
                    notificationsToggle.classList.remove('active');
                }
            });
        }

        // Logout handler
        const logoutDropdown = document.getElementById('logoutDropdown');
        if (logoutDropdown) logoutDropdown.addEventListener('click', () => {
            sessionStorage.removeItem('loggedInUser');
            sessionStorage.removeItem('userRole');
            window.location.href = getSitePage('login');
        });

        // Profile menu toggle
        const profileMenuToggle = document.getElementById('profileMenuToggle');
        if (profileMenuToggle) profileMenuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('profileDropdown').classList.toggle('active');
        });

        document.addEventListener('click', () => {
            const pd = document.getElementById('profileDropdown');
            if (pd) pd.classList.remove('active');
        });

        document.addEventListener('DOMContentLoaded', () => {
            initPage();
        });
    </script>

    <!-- --------- MAIN JS ---------- -->
    <script src="../assets/js/main.js"></script>
</body>
</html>
